version: 2
updates:
  # Cargo dependencies — opens a PR when a crate has an update,
  # including security advisories against Cargo.lock. Same convention
  # as sync-mesh-core: routine minor/patch bumps grouped into one PR,
  # security updates always get their own.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # Keep the CI/release workflow actions themselves up to date —
  # checkout, rust-toolchain, release-plz-action, and the PR-title
  # checker included.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # dtolnay/rust-toolchain@1.75.0 in the msrv job is the MSRV pin, not
      # a version to keep current - Dependabot cannot tell "a version
      # pinned as a floor to test against" from "a version to keep
      # current", and opened exactly this PR (1.75.0 -> 1.120.0) for real,
      # which would have silently turned the MSRV job into just another
      # latest-Rust build. Closed without merging; same fix already proven
      # on a sibling project (rustnix) for the identical bug.
      - dependency-name: "dtolnay/rust-toolchain"
