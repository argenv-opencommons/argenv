name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: build, test, lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      # Each published crate carries its own copy of the license texts (cargo packages a
      # crate from its own directory, so a file at the repository root does not travel).
      - name: License files are identical in every published crate
        run: |
          for crate in crates/argenv crates/argenv-resolve; do
            cmp LICENSE-MIT "$crate/LICENSE-MIT"
            cmp LICENSE-APACHE "$crate/LICENSE-APACHE"
          done

      # --all-targets so tests and examples are linted too: a lint that only
      # fires in a test target is still a lint.
      - name: Clippy
        run: cargo clippy --workspace --all-features --all-targets -- -D warnings

      # `--all-targets` is every target that can hold a test: the library and binary unit
      # tests, `tests/*.rs` (the specification: scenario, declaration, reading, linting,
      # document, schema, cli, integration), the examples and their own tests, and the
      # mock program. It must not be `--examples`: that flag *restricts* cargo to the
      # examples, which is what this step did before, so none of the specification ran.
      # The generators emit shell code, so they are tested in the real shells. nushell is not
      # packaged for Ubuntu: it is downloaded at a pinned version.
      - name: Install the shells and groff for the generator tests
        # A download that stalls must fail the step, not hold the job for hours.
        timeout-minutes: 10
        run: |
          # Only what the tests run. `groff` alone drags in ImageMagick, Ghostscript and fonts
          # through its recommends (40 packages), and a stalled mirror download of one of those
          # held a job for ten minutes; `groff-base` is the formatter itself.
          apt="sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30"
          $apt update
          $apt install -y --no-install-recommends fish zsh groff-base
          nu_version=0.116.1
          nu="nu-${nu_version}-x86_64-unknown-linux-musl"
          curl --fail --silent --show-error --location --retry 5 --retry-delay 3 --max-time 180 \
            -o "$RUNNER_TEMP/nu.tar.gz" \
            "https://github.com/nushell/nushell/releases/download/${nu_version}/${nu}.tar.gz"
          tar xzf "$RUNNER_TEMP/nu.tar.gz" -C "$RUNNER_TEMP"
          sudo install "$RUNNER_TEMP/${nu}/nu" /usr/local/bin/nu
          nu --version

      - name: Test
        env:
          # a missing shell must fail the tests, not silently skip them
          ARGENV_REQUIRE_SHELLS: "1"
        run: cargo test --workspace --all-features --all-targets

      # `--all-targets` does not include documentation tests.
      - name: Documentation tests
        run: cargo test --workspace --all-features --doc

      - name: Docs (warnings are errors)
        run: cargo doc --no-deps -p argenv -p argenv-resolve --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    name: minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.75.0
      - run: cargo build --workspace --all-features

  conformance:
    name: independent schema conformance
    runs-on: ubuntu-latest
    # `cargo test` asserts what the schema *claims*. This job asserts what a
    # foreign JSON Schema engine *does* with it, so the schema is not marked by
    # the code that produced it.
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Regenerate the example document
        run: cargo run -p argenv-resolve --example consumer > /tmp/example.json

      - name: Validate with a third-party engine
        run: |
          python3 -m pip install --quiet jsonschema
          python3 dev/conformance.py /tmp/example.json api/v1/example.json

  integration:
    name: mock program integration tests
    runs-on: ubuntu-latest
    # The `test` job's `cargo test --all-targets` already runs this file - it is
    # broken out as its own job so a failure here reads as "a real feature or
    # anti-pattern regressed in an actual running program", distinct from a
    # unit-level assertion failing elsewhere in the workspace.
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p argenv-resolve --test integration
