[package]
name = "argenv-resolve"
description = "Resolve an argenv contract against a real invocation - argv and envp, with precedence, defaults, and linting. Depends on argenv for the declared data; argenv depends on nothing here."
keywords = ["cli", "env", "arguments", "parser", "invocation"]
categories = ["command-line-interface", "config", "development-tools"]
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# A real, compiled program used only by tests/integration.rs, which spawns it
# as a subprocess with real argv/env and checks its actual behaviour - not a
# user-facing example, and not published.
[[bin]]
name = "argenv-resolve-mock"
path = "tests/fixtures/mock.rs"

[dependencies]
argenv = { path = "../argenv", version = "0.2" }
serde = { workspace = true }
serde_json = { workspace = true }

[package.metadata.docs.rs]
all-features = true
