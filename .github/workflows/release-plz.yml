name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-plz:
    name: release-plz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: MarcoIeni/release-plz-action@v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # NEXT STEP (same as the workflow this replaces): add the
          # CARGO_REGISTRY_TOKEN repo secret. Until then, this step still
          # correctly maintains the release PR (changelog + version bump) on
          # every push to main — only the actual `cargo publish` at the end
          # of a cut release needs the token, and that only runs once a
          # release PR has been merged, which won't happen by itself.
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
