name: PR Title

# Plain pull_request, not pull_request_target: the latter reads the workflow
# file from the base branch, which means a workflow introduced in the same
# PR that adds it can never fire on that PR — learned this the hard way on
# a sibling project, not repeating it here.
on:
  pull_request:
    types: [opened, edited, synchronize]

permissions:
  pull-requests: read

jobs:
  check:
    name: conventional commit format
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            style
            test
            build
            ci
            chore
            revert
          scopes: |
            model
            cli
            contract
            lint
            api
            ci
            deps
            release
          # Scope is encouraged, not mandatory — a docs or chore commit that
          # doesn't cleanly belong to one part of the system is fine without
          # one.
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject after "type(scope): " must not start with an
            uppercase letter — keep it lowercase, imperative mood.
